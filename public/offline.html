<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Website offline | Shivam Steel Railing &amp; Furniture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #ffffff;
      color: #1a1a1a;
      font-family: Montserrat, sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(560px, 100%);
      text-align: center;
    }
    p.kicker {
      margin: 0 0 12px;
      color: #8a8668;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.4px;
      line-height: 1.25;
    }
    h1::after {
      content: "";
      display: block;
      width: 60px;
      height: 3px;
      margin: 18px auto 0;
      background: #1a1a1a;
    }
    p {
      margin: 22px 0 0;
      color: #5c5c5c;
      font-size: 1rem;
    }
    strong { color: #1a1a1a; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Shivam Steel Railing &amp; Furniture</p>
    <h1>This website is offline</h1>
    <p>The full payment for this website has not been received.</p>
    <p><strong>The website will be turned back on once the balance is paid.</strong></p>
  </main>
</body>
</html>
